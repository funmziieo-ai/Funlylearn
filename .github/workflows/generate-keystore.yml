name: Generate Signing Keystore (run this ONCE only)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # IMPORTANT: change the passwords below to your own before running
      # this. Anyone who sees this file could otherwise see the passwords.
      # A safer approach once you're comfortable: delete this file after
      # your one-time run so the passwords aren't left visible in your repo.
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias funlylearn \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore funlylearn-release.keystore \
            -storepass FunlylearnisaGlobalBrand2026 \
            -keypass FunlylearnisaGlobalBrand2026 \
            -dname "CN=FunlyLearn, OU=FunlyLearn, O=FunlyLearn, L=Lagos, S=Lagos, C=NG"

      # Produces a clean, single-line base64 version directly, using the
      # same trusted environment that created the keystore itself — no
      # third-party web tool involved, so there's no risk of an extra
      # prefix or line-wrapping corrupting it. Copy this file's content
      # EXACTLY as your KEYSTORE_BASE64 secret value.
      - name: Generate base64 version (for the KEYSTORE_BASE64 secret)
        run: base64 -w 0 funlylearn-release.keystore > keystore-base64.txt

      - name: Upload keystore (download this immediately!)
        uses: actions/upload-artifact@v4
        with:
          name: funlylearn-release-keystore
          path: funlylearn-release.keystore

      - name: Upload base64 text file
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64-text
          path: keystore-base64.txt
