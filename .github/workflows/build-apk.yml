name: Build Android APK + AAB

# This entire build runs on GitHub's servers, not your Chromebook.
# Run it from the "Actions" tab: Build Android APK + AAB -> Run workflow.
# It no longer runs on every commit, so ordinary website changes don't
# trigger a 5-15 minute app build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run of this whole workflow takes 5-15 minutes. If any
    # single step hangs (a stuck interactive prompt, a stalled
    # download), this forces the whole job to fail after 30 minutes
    # instead of silently running for hours with no clear signal that
    # something is actually wrong.
    timeout-minutes: 30

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Your live site is built with Bun (bun.lockb in the repo, and the
      # actual Vercel build command is "bun run build"), not npm. Using
      # npm here instead would let npm freely resolve its own dependency
      # versions from package.json, which could differ from the exact
      # versions Bun resolved and that your production site actually
      # runs on -- a real source of "works on Vercel, breaks in the APK"
      # bugs. Bun is used here for exactly the core app dependencies to
      # avoid that; the Capacitor tooling steps below are unrelated new
      # packages, not part of the existing lockfile, so npm/npx is fine
      # for those specifically.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web app dependencies
        run: bun install

      - name: Build the web app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install Capacitor
        run: |
          # Pinned to version 8 to match @capacitor/core in package.json.
          npm install @capacitor/core@^8
          npm install -D @capacitor/cli@^8
          npm install @capacitor/android@^8
          npm install @capacitor/browser@^8

      - name: Create Capacitor config
        run: |
          # The app opens the live funlylearn.com, so every website update
          # appears in the app straight away, with no new app release.
          # To make the app carry its own copy instead, delete the
          # "server" block below.
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.funlylearn.app",
            "appName": "FunlyLearn",
            "webDir": "dist",
            "server": {
              "url": "https://funlylearn.com",
              "androidScheme": "https",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

      - name: Add Android platform (only if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android < /dev/null
          else
            npx cap sync android < /dev/null
          fi

      - name: Add camera permission to the freshly-generated manifest
        run: |
          sed -i 's/<manifest /<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i\    <uses-feature android:name="android.hardware.camera" android:required="false" />' android/app/src/main/AndroidManifest.xml
          echo "Manifest after patching:"
          cat android/app/src/main/AndroidManifest.xml

      # Google Play only accepts an upload whose version code is higher
      # than the last one, so every build uses GitHub's run number
      # (1, 2, 3...) as its version code, e.g. version 1.0.7 = build 7.
      - name: Set the app version from the build number
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          echo "Version set to:"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Set up app icon
        run: |
          mkdir -p assets
          cp src/assets/images/icon.png assets/icon.png
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Set up Java (required to build the Android project)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Verify the decoded keystore is valid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "File size in bytes:"
          wc -c < android/app/release.keystore
          echo "File type:"
          file android/app/release.keystore
          echo "Attempting to list the keystore contents:"
          keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD"

      - name: Build the signed release APK (for Loveworld / direct install)
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # New: builds the Android App Bundle format Google Play actually
      # requires for production submission -- a plain APK alone is not
      # accepted for new app releases. Uses the exact same keystore and
      # signing secrets as the APK build above, just a different Gradle
      # task and output format.
      - name: Build the signed release AAB (for Google Play)
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APK to FunlyLearn.apk
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/FunlyLearn.apk

      - name: Rename AAB to FunlyLearn.aab
        run: mv android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/bundle/release/FunlyLearn.aab

      - name: Upload signed APK (Loveworld / direct install)
        uses: actions/upload-artifact@v4
        with:
          name: FunlyLearn-release-apk
          path: android/app/build/outputs/apk/release/FunlyLearn.apk

      - name: Upload signed AAB (Google Play submission)
        uses: actions/upload-artifact@v4
        with:
          name: FunlyLearn-release-aab
          path: android/app/build/outputs/bundle/release/FunlyLearn.aab
