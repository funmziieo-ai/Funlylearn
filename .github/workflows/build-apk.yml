name: Build Android APK

# This entire build runs on GitHub's servers, not your Chromebook.
# Trigger it manually from the "Actions" tab in your repo, or it will
# also run automatically any time you push to the main branch.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web app dependencies
        run: npm install

      - name: Build the web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install Capacitor
        run: |
          npm install @capacitor/core
          npm install -D @capacitor/cli
          npm install @capacitor/android

      # Creates the Capacitor config file directly, instead of running
      # the interactive "npx cap init" command (which can't run
      # unattended in an automated cloud build).
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.funlylearn.app",
            "appName": "FunlyLearn",
            "webDir": "dist"
          }
          EOF

      - name: Add Android platform (only if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      # Uses the existing Mama Titi photo as a real placeholder app icon,
      # instead of shipping Capacitor's generic default icon. This isn't
      # a polished, professionally-designed icon (that's a later task,
      # likely for whoever handles final Play Store polish) — it just
      # gives testers something recognizable instead of a blank default.
      - name: Set up app icon from existing Mama Titi photo (placeholder)
        run: |
          mkdir -p assets
          cp src/assets/images/mama_titi_official_1784860280943.jpg assets/icon.png
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Set up Java (required to build the Android project)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Decodes the keystore secret back into a real file the build can
      # sign with. Requires these GitHub Secrets to already be set:
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build the signed release APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APK to FunlyLearn.apk
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/FunlyLearn.apk

      # Makes the finished, signed APK downloadable from the "Actions"
      # tab, under this workflow run, once it finishes. This is the file
      # you upload to Loveworld Appstore (or any third-party Android
      # store that accepts a plain signed APK).
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FunlyLearn-release-apk
          path: android/app/build/outputs/apk/release/FunlyLearn.apk
